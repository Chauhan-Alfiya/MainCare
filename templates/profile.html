<style>
:root {
    --primary-color: #1e40af;
    --secondary-color: #64748b;
    --success-bg: #dcfce7;
    --success-text: #166534;
    --card-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.profile-wrapper {
    max-width: 850px;
    margin: 50px auto;
    padding: 0 20px;
}

.profile-card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
    border: 1px solid #e2e8f0;
}

/* Banner & Header */
.profile-banner {
    height: 140px;
    background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
}

.profile-header-main {
    padding: 0 40px 30px;
    margin-top: -60px;
    display: flex;
    align-items: flex-end;
    gap: 25px;
}

.avatar-initials {
    width: 120px;
    height: 120px;
    background: #ffffff;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    font-weight: 800;
    color: var(--primary-color);
    box-shadow: 0 8px 16px rgba(0,0,0,0.12);
    border: 5px solid #ffffff;
}

.header-text h1 {
    margin: 0;
    font-size: 26px;
    color: #0f172a;
    font-weight: 700;
}

.role-badge {
    background: var(--success-bg);
    color: var(--success-text);
    padding: 6px 14px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
}

/* Information Body */
.profile-details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    padding: 40px;
    background: #ffffff;
}

.info-item {
    padding-bottom: 15px;
    border-bottom: 1px solid #f1f5f9;
}

.info-item label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    color: var(--secondary-color);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
}

.info-item .data-value {
    font-size: 15px;
    color: #1e293b;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
}

.info-item i {
    color: var(--primary-color);
    width: 18px;
    text-align: center;
}

/* Footer Section */
.profile-actions {
    padding: 0 40px 40px;
}

.back-btn {
    text-decoration: none;
    color: var(--primary-color);
    font-weight: 700;
    font-size: 14px;
    transition: 0.2s;
}

.back-btn:hover {
    color: #1d4ed8;
    text-decoration: underline;
}

/* Responsive */
@media (max-width: 650px) {
    .profile-header-main {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    .profile-details-grid {
        grid-template-columns: 1fr;
        padding: 30px 20px;
    }
}
</style>

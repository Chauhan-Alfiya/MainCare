<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | MindCare</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Register CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

</head>

<body>

<div class="container py-4">

<div class="row align-items-center justify-content-center" style="min-height:90vh;">

    <!-- Left Side -->

    <div class="col-lg-5 register-left d-none d-lg-flex">

        <div class="left-content">

            <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">

            <h1>Join MindCare</h1>

            <p>

                Create your free MindCare account and access AI support,
                mental health assessments, counselling services and
                wellness resources anytime.

            </p>

            <div class="feature mb-3">

                <i class="bi bi-shield-check"></i>

                Safe & Secure Platform

            </div>

            <div class="feature mb-3">

                <i class="bi bi-chat-heart"></i>

                AI Mental Health Assistant

            </div>

            <div class="feature">

                <i class="bi bi-book-half"></i>

                Wellness Resources

            </div>

        </div>

    </div>

    <!-- Right Side -->

    <div class="col-lg-7 d-flex justify-content-center align-items-center py-4">

        <div class="register-card">

            <div class="text-center mb-4">

                <h2>Create Account</h2>

                
            </div>

            <form>

                <!-- Name -->

                <div class="mb-3">

                    <label class="form-label">Full Name</label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-person-fill"></i>

                        </span>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Enter your full name"
                            required>

                    </div>

                </div>

                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label">Email Address</label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-envelope-fill"></i>

                        </span>

                        <input
                            type="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>

                </div>

                <!-- Class & Stream -->

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Class</label>

                        <select class="form-select" required>

                            <option selected disabled>Select Class</option>

                            <option>11th</option>

                            <option>12th</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Stream</label>

                        <select class="form-select" required>

                            <option selected disabled>Select Stream</option>

                            <option>Science</option>

                            <option>Commerce</option>

                            <option>Arts</option>

                        </select>

                    </div>

                </div>

                <!-- Password -->

                <div class="mb-3">

                    <label class="form-label">Password</label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-lock-fill"></i>

                        </span>

                        <input
                            type="password"
                            class="form-control"
                            placeholder="Create Password"
                            required>

                    </div>

                </div>

                <!-- Confirm Password -->

                <div class="mb-4">

                    <label class="form-label">Confirm Password</label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-lock-fill"></i>

                        </span>

                        <input
                            type="password"
                            class="form-control"
                            placeholder="Confirm Password"
                            required>

                    </div>

                </div>

                <!-- Register Button -->

                <button type="submit" class="btn btn-register w-100">

                    <i class="bi bi-person-plus-fill me-2"></i>

                    Create Account

                </button>

            </form>

            <hr>

            <p class="text-center mb-0">

                Already have an account?

                <a href="{{ url_for('login') }}" class="fw-semibold">

                    Login

                </a>

            </p>

        </div>

    </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

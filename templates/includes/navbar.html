<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

.dashboard-navbar{

    background:#ffffff;

    height:75px;

    box-shadow:0 2px 8px rgba(0,0,0,.05);

    border-bottom:1px solid #eef2f7;

    padding:0 30px;

}

/* Logo */

.navbar-brand{

    font-size:30px;

    font-weight:700;

    display:flex;

    align-items:center;

    gap:2px;

}

.logo{
    width:44px;
    margin-left:-3px;

    margin-right:-3px;

}

/* Right Menu */

.nav-right{

    margin-left:auto;

    display:flex;

    align-items:center;

    gap:28px;

}

/* Home */

.home-link{

    color:#0E7490 !important;

    font-size:18px;

    font-weight:600;
}

.home-link{

    font-size:17px;

    font-weight:600;

}
/* Divider */

.divider{

    width:1px;

    height:28px;

    background:#d1d5db;

}

/* Profile */

/* Profile */

.profile-btn{

    width:46px;
    height:46px;

    border-radius:50%;

    background:linear-gradient(135deg,#0E7490,#14B8A6);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;

    cursor:pointer;

    border:2px solid #ffffff;

    outline:3px solid #d8f7f3;

    transition:.3s;

}

.profile-btn:hover{

    transform:scale(1.05);

    background:linear-gradient(135deg,#14B8A6,#0E7490);

}


</style>

</head>

<body>

<nav class="navbar dashboard-navbar">

<div class="container-fluid">

<!-- Logo -->

<a class="navbar-brand" href="#">

<span>Mind</span>

<img src="{{ url_for('static', filename='images/logo.png') }}" class="logo">

<span>Care</span>

</a>

<!-- Right -->

<div class="nav-right">

<a href="{{ url_for('student_dashboard') }}" class="nav-link home-link">

<i class="bi bi-house-fill me-1"></i>

Home

</a>

<div class="divider"></div>

<div class="profile-btn" onclick="toggleSidebar()">

<i class="bi bi-person-fill"></i>

</div>

</div>

</div>

</nav>

</body>

</html>
